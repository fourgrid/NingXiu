<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>柠檬秀秀 🍋 - 让每张照片都清新可人</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="logo">🍋 柠檬秀秀</div>
  <div class="top-actions">
    <button id="btnOpen" class="btn primary">📂 打开图片</button>
    <button id="btnSave" class="btn primary" disabled>💾 保存图片</button>
    <span class="sep"></span>
    <button id="btnUndo" class="btn" disabled title="撤销 (⌘Z)">↩️ 撤销</button>
    <button id="btnRedo" class="btn" disabled title="重做 (⇧⌘Z)">↪️ 重做</button>
    <button id="btnReset" class="btn" disabled title="恢复原图">🔄 原图</button>
  </div>
</header>

<div id="main">
  <nav id="sidebar"><!-- 由 main.js 生成 --></nav>

  <section id="stage">
    <div id="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">🍋</div>
        <p class="dz-title">把图片拖到这里，或点击选择图片</p>
        <p class="dz-sub">支持 JPG / PNG / WebP · 全部处理在本机完成，照片不上传（AI 功能除外，需自行配置 API）</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </div>
    <canvas id="canvas" hidden></canvas>
    <div id="toast" hidden></div>
  </section>

  <aside id="panel">
    <div id="panelContent"><p class="hint">👈 打开图片后，从左侧选择功能</p></div>
  </aside>
</div>

<input type="file" id="collageFiles" accept="image/*" multiple hidden>
<script src="js/util.js"></script>
<script src="js/pixels.js"></script>
<script src="js/core.js"></script>
<script src="js/tools-basic.js"></script>
<script src="js/tools-draw.js"></script>
<script src="js/tools-collage.js"></script>
<script src="js/ai-config.js"></script>
<script src="js/ai-features.js"></script>
<script src="js/main.js"></script>
</body>
</html>
