<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>柠檬秀秀 🍋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 顶栏：极简 -->
<header id="topbar">
  <div class="logo">🍋 柠檬秀秀</div>
  <div class="top-actions">
    <button id="btnUndo" class="icon-btn" disabled title="撤销">↩️</button>
    <button id="btnRedo" class="icon-btn" disabled title="重做">↪️</button>
    <button id="btnReset" class="icon-btn" disabled title="恢复原图">🔄</button>
    <button id="btnOpen" class="btn primary">打开图片</button>
    <button id="btnSave" class="btn accent" disabled>保存</button>
    <button id="btnSettings" class="icon-btn" title="设置">⚙️</button>
  </div>
</header>

<!-- 画布区 -->
<section id="stage">
  <div id="dropzone">
    <div class="dz-inner">
      <div class="dz-icon">🍋</div>
      <p class="dz-title">把图片拖到这里，或点击选择图片</p>
      <p class="dz-sub">本地处理，照片不上传 · AI 功能需自配 Key</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
  </div>
  <canvas id="canvas" hidden></canvas>
  <div id="toast" hidden></div>
</section>

<!-- 二级功能条（当前分类的子功能） -->
<div id="subbar" hidden></div>

<!-- 工具参数面板 -->
<section id="panel" hidden><div id="panelContent"></div></section>

<!-- 底部 Tab（美图式） -->
<nav id="tabbar"></nav>

<!-- 设置页（cc-switch 风格全屏页） -->
<div id="settings" hidden>
  <div class="set-header">
    <button class="icon-btn" id="setBack">←</button>
    <span>设置</span>
    <span style="width:32px"></span>
  </div>
  <div id="settingsBody"></div>
</div>

<!-- 相机页（美图式全屏相机） -->
<div id="cameraPage" hidden>
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="cam-styles" id="camStyles"></div>
  <div class="cam-controls">
    <button class="cam-side-btn" id="camClose"><span class="ic">✕</span>关闭</button>
    <button id="camShutter">🍋</button>
    <button class="cam-side-btn" id="camFlip"><span class="ic">🔄</span>翻转</button>
  </div>
</div>

<input type="file" id="collageFiles" accept="image/*" multiple hidden>
<script src="js/util.js"></script>
<script src="js/pixels.js"></script>
<script src="js/core.js"></script>
<script src="js/tools-basic.js"></script>
<script src="js/tools-draw.js"></script>
<script src="js/tools-collage.js"></script>
<script src="js/tools-batch.js"></script>
<script src="js/tools-pro.js"></script>
<script src="js/ai-config.js"></script>
<script src="js/ai-features.js"></script>
<script src="js/camera.js"></script>
<script src="js/main.js"></script>
</body>
</html>
